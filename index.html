<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CODE JENARATE</title>

<!-- BengalAds Verification Code -->
<meta name="bengalads-site-verification" content="942c9e9232b1361d1aedcd643cc3b99e3f02edeeb841d0fa">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; font-family: 'Segoe UI', Arial; overflow: hidden; transition: background 0.5s ease; }

.container {
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
}

.header { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 10px var(--main-color); padding: 5px 0; color: var(--main-color); }
.ad {
  width: 320px;
  height: 50px;
  background: rgba(0,0,0,0.4);
  border: 2px solid var(--main-color);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #aaa;
  flex-shrink: 0;
  box-shadow: 0 0 15px var(--main-color);
}
.middle {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.page-info { font-size: 18px; margin-bottom: 25px; color: #ddd; font-weight: bold; }
.btn {
  padding: 20px 70px;
  font-size: 22px;
  background: var(--main-color);
  border: none;
  border-radius: 15px;
  color: #000;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 20px var(--main-color);
  transition: transform 0.2s;
}
.btn:active { transform: scale(0.95); }
.btn:disabled { background: #444; color: #888; box-shadow: none; }
#timer { font-size: 32px; font-weight: 900; color: var(--main-color); height: 35px; margin-top: 15px; text-shadow: 0 0 10px var(--main-color); }
</style>
</head>
<body>

<div class="container">

  <div class="ad" id="banner-top">Banner 320x50 - Top</div>

  <div class="middle">
    <div class="header" id="app-name">CODE JENARATE</div>
    <div class="page-info" id="page-info">Page 1 / 20</div>
    <button class="btn" id="mainBtn" onclick="nextStep()">NEXT PAGE</button>
    <div id="timer"></div>
  </div>

  <div class="ad" id="banner-bottom">Banner 320x50 - Bottom</div>

</div>

<script>
// 20 টা Neon Color Theme
const colors = [
  "#00ff88", "#00d4ff", "#ff00ff", "#ffaa00", "#ff0044",
  "#00ffaa", "#aa00ff", "#ff8800", "#00aaff", "#ff00aa",
  "#44ff00", "#0044ff", "#ff44ff", "#ffff00", "#ff2222",
  "#22ff22", "#2222ff", "#ff22ff", "#22ffff", "#ffcc00"
];

const firebaseConfig = {
  apiKey: "AIzaSyB2aQM3WAgyDRUBJC-ywBtkNO6Wk12ra00",
  authDomain: "code-jenarate.firebaseapp.com",
  databaseURL: "https://code-jenarate-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "code-jenarate",
  storageBucket: "code-jenarate.firebasestorage.app",
  messagingSenderId: "1004613845366",
  appId: "1:1004613845366:web:d3d3a749a91ceb4555ba57"
};

let script1 = document.createElement('script');
script1.src = "https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js";
document.head.appendChild(script1);

let script2 = document.createElement('script');
script2.src = "https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js";
document.head.appendChild(script2);

let currentPage = 1;
let totalPages = 20;
let finalLink = "";
let banners = {};

script2.onload = () => {
  firebase.initializeApp(firebaseConfig);
  let db = firebase.database();
  db.ref("app_data").on("value", (snapshot) => {
    let data = snapshot.val();
    if(data){
      finalLink = data.final_link || "#";
      banners = data.banners || {};
      loadPage(currentPage);
    }
  });
}

function loadPage(pageNum){
  let color = colors[pageNum - 1];
  document.documentElement.style.setProperty('--main-color', color);
  document.body.style.background = `linear-gradient(180deg, #000 0%, #111 100%)`;

  document.getElementById("page-info").innerText = `Page ${pageNum} / ${totalPages}`;
  let btn = document.getElementById("mainBtn");
  if(pageNum === totalPages){ btn.innerText = "DOWNLOAD"; }
  else { btn.innerText = "NEXT PAGE"; }

  let banner1 = banners[`page${pageNum}`]?.banner1 || `<b style="color:${color}">Banner1 - Page ${pageNum}</b>`;
  let banner2 = banners[`page${pageNum}`]?.banner2 || `<b style="color:${color}">Banner2 - Page ${pageNum}</b>`;
  document.getElementById("banner-top").innerHTML = banner1;
  document.getElementById("banner-bottom").innerHTML = banner2;
}

function nextStep(){
  let btn = document.getElementById("mainBtn");
  let timerDiv = document.getElementById("timer");
  let count = 3;
  btn.disabled = true;
  timerDiv.innerText = count;
  let countdown = setInterval(() => {
    count--;
    timerDiv.innerText = count > 0? count : "";
    if(count < 0){
      clearInterval(countdown);
      btn.disabled = false;
      if(currentPage === totalPages){
        firebase.database().ref("app_data/analytics/total").transaction((c) => (c||0)+1);
        firebase.database().ref("app_data/analytics/today").transaction((c) => (c||0)+1);
        firebase.database().ref("app_data/analytics/monthly").transaction((c) => (c||0)+1);
        window.open(finalLink, "_blank");
        currentPage = 1;
        loadPage(currentPage);
      } else {
        currentPage++;
        loadPage(currentPage);
      }
    }
  }, 1000);
}
</script>
</body>
</html>
